name: nexon_erp
description: Modern Cloud ERP for Wholesale Businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  decimal: ^3.2.1
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  shared_preferences: ^2.3.3
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dummy_data/
    - assets/images/

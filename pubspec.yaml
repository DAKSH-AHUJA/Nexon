name: nexon_erp
description: Modern Cloud ERP for Wholesale Businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  decimal: ^3.2.1
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  flutter_animate: ^4.5.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  shared_preferences: ^2.3.3
  equatable: ^2.0.7
  crypto: ^3.0.6

  # Offline Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cloud Sync - Supabase
  supabase_flutter: ^2.5.0
  supabase: ^2.2.0

  # Connectivity & Network
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # Background Sync
  workmanager: ^0.5.2

  # State Persistence
  riverpod_annotation: ^2.3.5

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1

  # Logging
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/dummy_data/
    - assets/images/
